<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363a4f"/>
      <stop offset="1" stop-color="#181926"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8aadf4"/>
      <stop offset="1" stop-color="#91d7e3"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b7bdf8"/>
      <stop offset="1" stop-color="#8aadf4"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c6a0f6"/>
      <stop offset="1" stop-color="#b7bdf8"/>
    </linearGradient>
    <path id="feather" d="M0 0 C70 -110 270 -250 470 -270 C440 -150 250 -20 0 0 Z"/>
  </defs>
  <!-- App tile, macOS icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Wing: three feathers, each one a tab -->
  <g transform="translate(300 660)">
    <use href="#feather" fill="url(#f3)" transform="rotate(-34) scale(0.9)"/>
    <use href="#feather" fill="url(#f2)" transform="rotate(-17) scale(1.0)"/>
    <use href="#feather" fill="url(#f1)" transform="rotate(0) scale(1.08)"/>
  </g>
  <!-- Terminal prompt -->
  <g fill="none" stroke="#cad3f5" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 700 L340 770 L250 840"/>
    <path d="M400 842 H520"/>
  </g>
</svg>
